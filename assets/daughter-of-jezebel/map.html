<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The World of Daughter of Jezebel</title><style>html,body{margin:0;overflow:hidden;background:#ead9b9}body{--foreground:#2b241e;--card:#f5e9cf;--muted-foreground:#66594c;--blue:#315d70;--orange:#a96c3f;--border:#8a765e;--red:#8d3029;--yellow:#cda84b}</style></head><body>
<div id="doj-map">

    #doj-map { color:var(--foreground); font-family:Georgia,serif; }
    #doj-map .map-wrap { position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; background:color-mix(in srgb,var(--card) 82%,var(--yellow) 18%); }
    #doj-map svg { display:block; width:100%; height:100%; }
    #doj-map .title { font-family:Georgia,serif; font-size:22px; font-weight:500; letter-spacing:2px; fill:var(--foreground); }
    #doj-map .subtitle { font-family:system-ui,sans-serif; font-size:11px; letter-spacing:1.5px; fill:var(--muted-foreground); }
    #doj-map .land { fill:color-mix(in srgb,var(--card) 72%,var(--yellow) 28%); stroke:color-mix(in srgb,var(--orange) 35%,var(--border)); stroke-width:1.4; }
    #doj-map .sea { fill:color-mix(in srgb,var(--card) 60%,var(--blue) 40%); }
    #doj-map .water { fill:color-mix(in srgb,var(--card) 48%,var(--blue) 52%); stroke:color-mix(in srgb,var(--blue) 70%,var(--border)); stroke-width:1.3; }
    #doj-map .terrain { fill:none; stroke:color-mix(in srgb,var(--orange) 42%,transparent); stroke-width:1.4; }
    #doj-map .kingdom { font-family:Georgia,serif; font-size:16px; letter-spacing:4px; fill:color-mix(in srgb,var(--foreground) 70%,transparent); }
    #doj-map .region { font-family:Georgia,serif; font-size:12px; font-style:italic; fill:var(--muted-foreground); }
    #doj-map .place-label { font-family:system-ui,sans-serif; font-size:12px; font-weight:500; fill:var(--foreground); paint-order:stroke; stroke:var(--card); stroke-width:4px; stroke-linejoin:round; }
    #doj-map .minor-label { font-family:system-ui,sans-serif; font-size:11px; fill:var(--muted-foreground); paint-order:stroke; stroke:var(--card); stroke-width:4px; }
    #doj-map .place { fill:var(--foreground); stroke:var(--card); stroke-width:2; }
    #doj-map .capital { fill:var(--red); stroke:var(--card); stroke-width:2.4; }
    #doj-map .uncertain { fill:var(--yellow); stroke:var(--foreground); stroke-width:1.3; }
    #doj-map .route { fill:none; stroke:var(--red); stroke-width:2; stroke-dasharray:6 5; opacity:.72; }
    #doj-map .route-secondary { fill:none; stroke:var(--blue); stroke-width:1.7; stroke-dasharray:3 5; opacity:.65; }
    #doj-map .frame { fill:none; stroke:color-mix(in srgb,var(--red) 72%,var(--foreground)); stroke-width:5; }
    #doj-map .inner-frame { fill:none; stroke:color-mix(in srgb,var(--blue) 68%,var(--foreground)); stroke-width:2; }
    #doj-map .legend { font-family:system-ui,sans-serif; font-size:11px; fill:var(--muted-foreground); }
    #doj-map .compass { fill:var(--foreground); }
    #doj-map .border-band { fill:color-mix(in srgb,var(--card) 68%,var(--yellow) 32%); stroke:color-mix(in srgb,var(--red) 66%,var(--foreground)); stroke-width:2; }
    #doj-map .orn-red { fill:color-mix(in srgb,var(--red) 76%,var(--foreground)); }
    #doj-map .orn-blue { fill:color-mix(in srgb,var(--blue) 74%,var(--foreground)); }
    #doj-map .orn-gold { fill:color-mix(in srgb,var(--yellow) 78%,var(--foreground)); }
    #doj-map .orn-line { fill:none; stroke:color-mix(in srgb,var(--foreground) 62%,transparent); stroke-width:2; }
    #doj-map .plaster { fill:var(--card); opacity:.20; mix-blend-mode:multiply; pointer-events:none; }
    #doj-map .title-rule { stroke:color-mix(in srgb,var(--red) 65%,var(--foreground)); stroke-width:2; }
